[package]
name = "grammatical-analysis"
version = "0.1.0"
description = "Local-first English grammar analysis desktop app"
authors = ["quentin"]
edition = "2021"
default-run = "grammatical-analysis"

[lib]
name = "grammatical_analysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
futures-util = "0.3"
thiserror = "2"
